name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows checks
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build Windows release
        run: npm run tauri build -- --no-bundle
      - name: Pack x64 MSIX for local validation
        shell: pwsh
        run: |
          ./src-tauri/packaging/build-msix.ps1 -IdentityName PixelPulse.LocalTest -Publisher 'CN=PixelPulse Local Test' -PublisherDisplayName 'PixelPulse Local Test'
      - name: Build diagnostic collector
        if: github.event_name == 'pull_request'
        working-directory: src-tauri
        run: cargo build --release --locked --example coletor_cli
      - name: Archive candidate binaries
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PixelPulse-Windows-x64-local-test
          path: |
            src-tauri/target/msix/*.msix
            src-tauri/target/release/pixelpulse.exe
            src-tauri/target/release/examples/coletor_cli.exe
          if-no-files-found: error
          retention-days: 14

  tag-release:
    name: Create release tag
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: '1.1.0.0'
    steps:
      - name: Tag the verified main commit
        shell: bash
        run: |
          set -euo pipefail
          repository="repos/$GITHUB_REPOSITORY"
          tag_ref="refs/tags/$RELEASE_TAG"

          existing_tag() {
            gh api "$repository/git/matching-refs/tags/$RELEASE_TAG" \
              --jq ".[] | select(.ref == \"$tag_ref\") | .object.sha"
          }

          current_tag="$(existing_tag)"
          if [[ -n "$current_tag" ]]; then
            echo "$tag_ref already points to $current_tag."
            exit 0
          fi

          main_sha="$(gh api "$repository/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "main advanced while the checks were running."
            exit 0
          fi

          if gh api --method POST "$repository/git/refs" -f ref="$tag_ref" -f sha="$GITHUB_SHA" --silent; then
            echo "Created $tag_ref at $GITHUB_SHA."
            exit 0
          fi

          # A concurrent attempt can create the tag between the read and the write.
          current_tag="$(existing_tag)"
          if [[ -z "$current_tag" ]]; then
            exit 1
          fi
          echo "$tag_ref already points to $current_tag."
