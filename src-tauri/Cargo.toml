[package]
name = "pixelpulse"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pixelpulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Apenas sistema e disco: sem rede, GPU do sysinfo ou pool de threads Rayon.
sysinfo = { version = "0.40.3", default-features = false, features = ["system", "disk"] }
# A DLL NVML é carregada em tempo de execução; sua ausência não impede iniciar.
nvml-wrapper = "0.13.0"
# Acrylic opcional do sistema; a UI conserva um fundo RGBA se ele falhar.
window-vibrancy = "0.8.1"


# Opções oficiais: https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.release]
# Prioriza o tamanho do executável em vez da velocidade máxima.
opt-level = 's'
# Otimiza em conjunto o código de diferentes crates, com maior tempo de build.
lto = true
# Compila cada crate em uma unidade para favorecer a otimização global.
codegen-units = 1
# Encerra o processo em caso de panic, dispensando o código de desenrolar a pilha.
panic = 'abort'
# Remove símbolos do binário final para reduzir seu tamanho.
strip = true
