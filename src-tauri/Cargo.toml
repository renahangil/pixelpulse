[package]
name = "pixelpulse"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pixelpulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Enable system and disk metrics only, keeping network, sysinfo GPU support and Rayon disabled.
sysinfo = { version = "0.40.3", default-features = false, features = ["system", "disk"] }
# Load NVML at runtime so the app can start without its DLL.
nvml-wrapper = "0.13.0"
# Request optional system Acrylic and keep an RGBA fallback.
window-vibrancy = "0.8.1"

[target.'cfg(windows)'.dependencies]
# Reuse Windows bindings to query this window's DWM attributes without capturing the screen.
windows = { version = "0.62.2", features = ["ApplicationModel", "Win32_Graphics_Dwm", "Win32_Graphics_DXCore",
    "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Performance",
    "Win32_System_Registry", "Win32_System_WinRT", "Win32_System_SystemInformation", "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging"] }


# Cargo profile options: https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.release]
# Optimize for executable size.
opt-level = 's'
# Optimize across crate boundaries at the cost of a longer build.
lto = true
# Use a single code generation unit to improve whole-crate optimization.
codegen-units = 1
# Abort on panic and omit stack unwinding code.
panic = 'abort'
# Strip symbols to reduce the size of the final executable.
strip = true
